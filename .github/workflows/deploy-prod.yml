name: Build & Deploy to Self-Hosted Runner

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      MODE_ENV: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Restart App with PM2
        run: |
          pm2 restart nextjs-app || pm2 start npm --name "nextjs-app" -- start -- -p 3000
